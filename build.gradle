plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven-central.storage-download.googleapis.com/maven2' }
    mavenCentral()
    maven {
        name = 'Hypixel'
        url = 'https://repo.hypixel.net/repository/Hypixel/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "net.hypixel:mod-api:${project.hypixel_mod_api_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'fabric_api_version', project.fabric_api_version
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft_version: project.minecraft_version,
                loader_version: project.loader_version, fabric_api_version: project.fabric_api_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(25)
}

jar {
    from('LICENSE') {
        rename 'LICENSE', 'LICENSE_safari-king'
    }
    from('THIRD_PARTY_NOTICES.md')
}

tasks.register('testParser', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.safariking.stats.ChatParserTest'
    enableAssertions = true
}

tasks.named('test') {
    failOnNoDiscoveredTests = false
}
check.dependsOn testParser

tasks.register('testRenderPipelines', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.safariking.HighlightRenderPipelinesTest'
    workingDir = layout.buildDirectory.get().asFile
}
check.dependsOn testRenderPipelines
